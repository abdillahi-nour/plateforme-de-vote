<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Créer une Élection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary-color: #9b5de5;
      --secondary-color: #6c9eff;
      --background-color: #f5f7fa;
      --text-color: #333;
      --border-color: #e0e0e0;
      --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: var(--background-color);
      color: var(--text-color);
    }

    .dashboard-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: white;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
      height: 100vh;
      position: fixed;
    }

    .sidebar-header {
      padding: 1.5rem;
      text-align: center;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
    }

    .sidebar-menu a {
      display: block;
      padding: 0.8rem 1.5rem;
      color: #777;
      text-decoration: none;
      transition: 0.3s;
    }

    .sidebar-menu a:hover {
      background: rgba(155, 93, 229, 0.1);
      color: var(--primary-color);
    }

    .main-content {
      margin-left: 260px;
      padding: 2rem;
      flex: 1;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      border: none;
    }

    .card-header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      font-weight: 600;
      padding: 1rem 1.5rem;
      font-size: 1.25rem;
    }

    .card-body {
      padding: 2rem;
    }

    .btn-primary {
      background-color: var(--primary-color);
      border: none;
    }

    .btn-primary:hover {
      background-color: #7e4bc2;
    }
  </style>
</head>

<body>
  <div class="dashboard-container">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <h3><i class="fas fa-user-shield"></i> Abdillahi Nour</h3>
          <small>Admin</small>
        </div>
        <div class="sidebar-menu">
            <a href="/createVote" class="nav-link active">
                <i class="fas fa-user-shield"></i> 
              <span>Créer une élection</span>
              </a>
          <a href="/adminVoteDetail" class="nav-link">
            <i class="fa fa-info-circle"></i>
            <span>Les elections </span>
          </a>
          <a href="/candidateDetails" class="nav-link">
            <i class="fa fa-info-circle"></i>
            <span>Liste des Candidats</span>
          </a>
          <a href="/ajouterCandidat" class="nav-link ">
            <i class="fas fa-user-plus"></i>
            <span>Nouveau Candidat</span>
          </a>
          <a href="/table_view" class="nav-link">
            <i class="fas fa-users"></i>
            <span>Gestion d'électeurs</span>
          </a>
          <a href="/changePhase" class="nav-link " aria-label="Contrôle du Vote">
            <i class="fa fa-poll-h"></i>
            <span>Contrôle du Vote</span>
          </a>
          <a href="/logout" class="nav-link logout-link" aria-label="Déconnexion">
            <i class="fa fa-sign-out-alt"></i>
            <span>Déconnexion</span>
          </a>
        </div>
      </div>

    <div class="main-content">
      <div class="card">
        <div class="card-header">
          <i class="fas fa-calendar-plus me-2"></i>Créer une nouvelle élection
        </div>
        <div class="card-body">
          <form id="createVoteForm" onsubmit="App.creerElection(); return false;"enctype="multipart/form-data">
            <div class="mb-3">
              <label for="electionName" class="form-label">Nom de l’élection</label>
              <input type="text" class="form-control" id="nomElection" placeholder="Élection Présidentielle 2025" required>
            </div>
            <div class="mb-3">
              <label for="startDate" class="form-label">Date de début</label>
              <input type="date" class="form-control" id="dateDebut" required>
            </div>
            <div class="mb-3">
              <label for="endDate" class="form-label">Date de fin</label>
              <input type="date" class="form-control" id="dateFin" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Créer l’élection</button>
  
          </form>
         
        </div>
      </div>
    </div>
  </div>


  <!-- JS: Bootstrap & dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
  <script src="js/web3.min.js"></script>
  <script src="js/truffle-contract.js"></script>
  <script src="js/app.js"></script>
  

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script src="js/web3.min.js"></script>
<script src="js/truffle-contract.js"></script>

<script src="js/app.js"></script>

<script src="./assets/js/core/popper.min.js"></script>
<script src="./assets/js/core/bootstrap-material-design.min.js"></script>
<script src="./assets/js/plugins/perfect-scrollbar.jquery.min.js"></script>
<!-- Plugin for the momentJs  -->
<script src="./assets/js/plugins/moment.min.js"></script>
<!-- Forms Validations Plugin -->
<script src="./assets/js/plugins/jquery.validate.min.js"></script>
<!--	Plugin for Tags, full documentation here: https://github.com/bootstrap-tagsinput/bootstrap-tagsinputs  -->
<script src="./assets/js/plugins/bootstrap-tagsinput.js"></script>
<!-- Plugin for Fileupload, full documentation here: http://www.jasny.net/bootstrap/javascript/#fileinput -->
<script src="./assets/js/plugins/jasny-bootstrap.min.js"></script>
<!-- Vector Map plugin, full documentation here: http://jvectormap.com/documentation/ -->
<script src="./assets/js/plugins/jquery-jvectormap.js"></script>
<!--  Plugin for the Sliders, full documentation here: http://refreshless.com/nouislider/ -->
<script src="./assets/js/plugins/nouislider.min.js"></script>
<!-- Include a polyfill for ES6 Promises (optional) for IE11, UC Browser and Android browser support SweetAlert -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/core-js/2.4.1/core.js"></script>
<!-- Library for adding dinamically elements -->
<script src="./assets/js/plugins/arrive.min.js"></script>
<!--  Notifications Plugin    -->
<script src="./assets/js/plugins/bootstrap-notify.js"></script>
<!-- Control Center for Material Dashboard: parallax effects, scripts for the example pages etc -->
<script src="./assets/js/material-dashboard.js?v=2.1.2" type="text/javascript"></script>

</body>
</html>
