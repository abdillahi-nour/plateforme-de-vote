<html lang="en">
<head>

  <!-- Bootstrap 5 CDN -->

  <!-- Fonts and icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:400,700|Material+Icons" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />


  <!-- Bootstrap Icons (optionnel) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root {
      --primary-color: #9b5de5;
      --secondary-color: #6c9eff;
      --primary-dark: #7e4bc2;
      --background-color: #f5f7fa;
      --text-color: #333;
      --text-light: #777;
      --border-color: #e0e0e0;
      --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --input-focus-color: #9b5de5;
      --success-color: #28a745;
      --info-color: #17a2b8;
      --warning-color: #ffc107;
    }
  
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: var(--background-color);
      color: var(--text-color);
      line-height: 1.6;
    }
  
    .dashboard-container {
      display: flex;
      min-height: 100vh;
    }
  
    /* Sidebar Styles */
    .sidebar {
      width: 260px;
      background: white;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
      position: fixed;
      height: 100vh;
      z-index: 100;
    }
  
    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    }
  
    .sidebar-header h3 {
      color: white;
      margin: 0;
      font-weight: 700;
      font-size: 1.4rem;
    }
  
    .sidebar-header small {
      color: rgba(255,255,255,0.8);
      font-size: 0.85rem;
    }
  
    .sidebar-menu {
      padding: 1rem 0;
    }
  
    .nav-link {
      display: flex;
      align-items: center;
      padding: 0.8rem 1.5rem;
      color: var(--text-light);
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s;
      margin: 0.25rem 1rem;
      border-radius: 6px;
    }
  
    .nav-link:hover {
      background-color: rgba(155, 93, 229, 0.1);
      color: var(--primary-color);
    }
  
    .nav-link.active {
      background-color: var(--primary-color);
      color: white;
      box-shadow: 0 4px 8px rgba(155, 93, 229, 0.2);
    }
  
    .nav-link i {
      margin-right: 12px;
      font-size: 1.25rem;
      width: 24px;
      text-align: center;
    }
  
    .logout-link {
      margin-top: 1rem;
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
      color: #dc3545 !important;
    }
  
    .logout-link:hover {
      background-color: rgba(220, 53, 69, 0.1) !important;
    }
  
    /* Main Content Styles */
    .main-content {
      margin-left: 260px;
      flex: 1;
      padding: 2rem;
    }
  
    /* Card Styles */
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      margin-bottom: 2rem;
      border: none;
      overflow: hidden;
    }
  
    .card-header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 1.25rem 1.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
    }
  
    .card-header i {
      margin-right: 10px;
    }
  
    .card-body {
      padding: 2rem;
    }
  
    /* Button Styles */
    .btn {
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  
    .btn i {
      margin-right: 8px;
    }
  
    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }
  
    .btn-primary:hover {
      background-color: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(155, 93, 229, 0.3);
    }
  
    .btn-lg {
      padding: 1rem 2rem;
      font-size: 1.1rem;
    }
  
    /* Alert Styles */
    .alert {
      border-radius: 8px;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
    }
  
    .alert-info {
      background-color: rgba(23, 162, 184, 0.1);
      border-left: 4px solid var(--info-color);
    }
  
    /* Badge Styles */
    .badge {
      padding: 0.5rem 1rem;
      font-weight: 600;
      border-radius: 50px;
    }
  
    .bg-primary {
      background-color: var(--primary-color) !important;
    }
  
    .bg-dark {
      background-color: #343a40 !important;
    }
  
    /* Phase Control Panel */
    .phase-control-panel {
      background-color: #f8f9fc;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.05);
    }
  
    .phase-indicator {
      background-color: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 1.5rem;
    }
  
    .phase-description {
      background-color: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
  
    /* Responsive Adjustments */
    @media (max-width: 992px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }
      
      .main-content {
        margin-left: 0;
      }
    }
  </style>
  
</head>

<body>
   <div class="position-fixed top-0 start-50 translate-middle-x p-3 w-100" style="z-index: 9999; max-width: 600px;">
    <div id="toastContainer" class="toast-container w-100"></div>
  </div>
  <div class="dashboard-container">
   
      <!-- Sidebar -->
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h3><i class="fas fa-user-shield"></i> Abdillahi Nour</h3>
          <small>Admin</small>
        </div>
        <div class="sidebar-menu">
          <a href="/adminCreateElection" class="nav-link active">
            <i class="fas fa-user-shield"></i> 
          <span>Créer une élection</span>
          </a>
      <a href="/adminDetailVote" class="nav-link">
        <i class="fa fa-info-circle"></i>
        <span>Les elections </span>
      </a>
          <a href="/candidateDetails" class="nav-link ">
            <i class="fa fa-info-circle"></i>
            <span>Liste des Candidats</span>
          </a>
          <a href="/ajouterCandidat" class="nav-link">
            <i class="fas fa-user-plus"></i>
            <span>Nouveau Candidat</span>
          </a>
          <a href="/table_view" class="nav-link">
            <i class="fas fa-users"></i>
          
            <span>Gestion d'électeurs</span>
          </a>
          <a href="/changePhase" class="nav-link" aria-label="Contrôle du Vote">
            <i class="fa fa-poll-h"></i>
            <span>Contrôle du Vote</span>
          </a>
          <a href="/logout" class="nav-link logout-link" aria-label="Déconnexion">
            <i class="fa fa-sign-out-alt"></i>
            <span>Déconnexion</span>
          </a>
        </div>
      </div>
      <!-- Main Content -->
<div class="main-content">
  <div class="container py-4">
    <!-- Carte unique avec formulaire -->
    <div class="card shadow border-0">
      <!-- En-tête -->
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">
          <i class="fas fa-plus-circle me-2"></i>Création d'une nouvelle élection
        </h5>
      </div>

      <!-- Corps du formulaire -->
      <div class="card-body p-4">
        <form id="createElectionForm" onsubmit="App.creerElection(); return false;">
          <!-- Champ Titre -->
          <div class="mb-4">
            <label for="titre" class="form-label fw-bold">
              <i class="fas fa-heading me-1 text-primary"></i> Titre de l'élection
            </label>
            <input type="text" 
                   id="titre" 
                   class="form-control form-control-lg" 
                   placeholder="Présidentielle 2025" 
                   required>
          </div>

          <!-- Section Dates (désactivée) -->
          <div class="mb-4">
            <h6 class="fw-bold mb-3 text-muted">
              <i class="fas fa-calendar-alt me-1"></i> Période électorale
            </h6>
            
            <div class="row g-3 bg-light p-3 rounded">
              <div class="col-md-6">
                <label for="dateDebut" class="form-label">Date de début</label>
                <input type="date" 
                       id="dateDebut" 
                       class="form-control" 
                       disabled>
              </div>
              
              <div class="col-md-6">
                <label for="dateFin" class="form-label">Date de fin</label>
                <input type="date" 
                       id="dateFin" 
                       class="form-control" 
                       disabled>
              </div>
              
              <div class="col-12">
                <small class="text-muted">
                  <i class="fas fa-info-circle me-1"></i>
                  Ces champs seront activés dans une version ultérieure
                </small>
              </div>
            </div>
          </div>

          <!-- Bouton de soumission -->
          <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary btn-lg px-4">
              <i class="fas fa-check-circle me-2"></i> Valider la création
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
   
  </div>
