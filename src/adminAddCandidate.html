    /* Main Content Styles */
    .main-content {

    /* Card Styles */
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      margin-bottom: 2rem;
      border: none;
      overflow: hidden;
    }
  
    .card-header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));

      padding: 1.25rem 1.5rem;
      font-size: 1.25rem;
      font-weight: 600;

      align-items: center;
    }
  
    .card-header i {
      margin-right: 10px;
    }
  
    .card-body {

    }
  
    /* Button Styles */
    .btn {
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  
    .btn i {
      margin-right: 8px;
    }
  
    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }
  
    .btn-primary:hover {
      background-color: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(155, 93, 229, 0.3);
    }
  
    .btn-lg {
      padding: 1rem 2rem;
      font-size: 1.1rem;
    }
  
    /* Alert Styles */
    .alert {
      border-radius: 8px;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
    }
  
    .alert-info {
      background-color: rgba(23, 162, 184, 0.1);
      border-left: 4px solid var(--info-color);
    }
  
    /* Badge Styles */
    .badge {
      padding: 0.5rem 1rem;
      font-weight: 600;
      border-radius: 50px;
    }
  
    .bg-primary {
      background-color: var(--primary-color) !important;
    }
  
    .bg-dark {

    /* Phase Control Panel */

    }
  
    /* Responsive Adjustments */
    @media (max-width: 992px) {

        width: 100%;
        height: auto;
        position: relative;
      }
      
      .main-content {

      }
    }

<div class="container mt-5">
  <div class="card shadow border-0">
    <div class="card-header text-white" style="background:#9b5de5;">
      <h5 class="mb-0">Ajouter les informations du candidat</h5>
    </div>
  


    <div class="card-body">
      <form id="ajouterCandidatForm"
            onsubmit="event.preventDefault(); App.ajouterCandidat();"
            enctype="multipart/form-data">

        <div class="row g-3">

          <!-- ▼ Sélection de l’élection (remplie via JS) -->
          <div class="mb-3">
            <label for="electionSelect" class="form-label">Élection concernée</label>
            <select id="electionSelect" class="form-select">
              <option disabled selected value="">── Sélectionnez une élection ──</option>
            </select>
            
          </div>
         
          
         
          

          <!-- Nom complet -->
          <div class="col-md-6">
            <label for="nom" class="form-label">Nom complet</label>
            <input type="text" id="nom" class="form-control" required>
          </div>

          <!-- Âge -->
          <div class="col-md-3">
            <label for="age" class="form-label">Âge</label>
            <input type="number" id="age" min="18" class="form-control" required>
          </div>

          <!-- Photo -->
          <div class="col-md-9">
            <label for="photo" class="form-label">Photo (JPEG/PNG)</label>
            <input type="file" id="photo" class="form-control" accept="image/*" required>
          </div>

          <!-- Description -->
          <div class="col-12">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" class="form-control" rows="3"
                      placeholder="Parcours, programme, motivations…" required></textarea>
          </div>

          <!-- Bouton Soumettre -->
          <div class="col-12 text-center">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="fas fa-user-plus me-1"></i>Ajouter le candidat
            </button>
          </div>
         
        </div><!-- /.row -->
      </form>
    </div><!-- /.card-body -->

<script>
  $(document).ready(function() {
    $().ready(function() {
      $sidebar = $('.sidebar');

      $sidebar_img_container = $sidebar.find('.sidebar-background');

      $full_page = $('.full-page');

      $sidebar_responsive = $('body > .navbar-collapse');

      window_width = $(window).width();

      fixed_plugin_open = $('.sidebar .sidebar-wrapper .nav li.active a p').html();

      if (window_width > 767 && fixed_plugin_open == 'Dashboard') {
        if ($('.fixed-plugin .dropdown').hasClass('show-dropdown')) {
          $('.fixed-plugin .dropdown').addClass('open');
        }

      }

      $('.fixed-plugin a').click(function(event) {
        // Alex if we click on switch, stop propagation of the event, so the dropdown will not be hide, otherwise we set the  section active
        if ($(this).hasClass('switch-trigger')) {
          if (event.stopPropagation) {
            event.stopPropagation();
          } else if (window.event) {
            window.event.cancelBubble = true;
          }
        }
      });

      $('.fixed-plugin .active-color span').click(function() {
        $full_page_background = $('.full-page-background');

        $(this).siblings().removeClass('active');
        $(this).addClass('active');

        var new_color = $(this).data('color');

        if ($sidebar.length != 0) {
          $sidebar.attr('data-color', new_color);
        }

        if ($full_page.length != 0) {
          $full_page.attr('filter-color', new_color);
        }

        if ($sidebar_responsive.length != 0) {
          $sidebar_responsive.attr('data-color', new_color);
        }
      });

      $('.fixed-plugin .background-color .badge').click(function() {
        $(this).siblings().removeClass('active');
        $(this).addClass('active');

        var new_color = $(this).data('background-color');

        if ($sidebar.length != 0) {
          $sidebar.attr('data-background-color', new_color);
        }
      });

      $('.fixed-plugin .img-holder').click(function() {
        $full_page_background = $('.full-page-background');

        $(this).parent('li').siblings().removeClass('active');
        $(this).parent('li').addClass('active');


        var new_image = $(this).find("img").attr('src');

        if ($sidebar_img_container.length != 0 && $('.switch-sidebar-image input:checked').length != 0) {
          $sidebar_img_container.fadeOut('fast', function() {
            $sidebar_img_container.css('background-image', 'url("' + new_image + '")');
            $sidebar_img_container.fadeIn('fast');
          });
        }

        if ($full_page_background.length != 0 && $('.switch-sidebar-image input:checked').length != 0) {
          var new_image_full_page = $('.fixed-plugin li.active .img-holder').find('img').data('src');

          $full_page_background.fadeOut('fast', function() {
            $full_page_background.css('background-image', 'url("' + new_image_full_page + '")');
            $full_page_background.fadeIn('fast');
          });
        }

        if ($('.switch-sidebar-image input:checked').length == 0) {
          var new_image = $('.fixed-plugin li.active .img-holder').find("img").attr('src');
          var new_image_full_page = $('.fixed-plugin li.active .img-holder').find('img').data('src');

          $sidebar_img_container.css('background-image', 'url("' + new_image + '")');
          $full_page_background.css('background-image', 'url("' + new_image_full_page + '")');
        }

        if ($sidebar_responsive.length != 0) {
          $sidebar_responsive.css('background-image', 'url("' + new_image + '")');
        }
      });

      $('.switch-sidebar-image input').change(function() {
        $full_page_background = $('.full-page-background');

        $input = $(this);

        if ($input.is(':checked')) {
          if ($sidebar_img_container.length != 0) {
            $sidebar_img_container.fadeIn('fast');
            $sidebar.attr('data-image', '#');
          }

          if ($full_page_background.length != 0) {
            $full_page_background.fadeIn('fast');
            $full_page.attr('data-image', '#');
          }

          background_image = true;
        } else {
          if ($sidebar_img_container.length != 0) {
            $sidebar.removeAttr('data-image');
            $sidebar_img_container.fadeOut('fast');
          }

          if ($full_page_background.length != 0) {
            $full_page.removeAttr('data-image', '#');
            $full_page_background.fadeOut('fast');
          }

          background_image = false;
        }
      });

      $('.switch-sidebar-mini input').change(function() {
        $body = $('body');

        $input = $(this);

        if (md.misc.sidebar_mini_active == true) {
          $('body').removeClass('sidebar-mini');
          md.misc.sidebar_mini_active = false;

          $('.sidebar .sidebar-wrapper, .main-panel').perfectScrollbar();

        } else {

          $('.sidebar .sidebar-wrapper, .main-panel').perfectScrollbar('destroy');

          setTimeout(function() {
            $('body').addClass('sidebar-mini');

            md.misc.sidebar_mini_active = true;
          }, 300);
        }

        // we simulate the window Resize so the charts will get updated in realtime.
        var simulateWindowResize = setInterval(function() {
          window.dispatchEvent(new Event('resize'));
        }, 180);

        // we stop the simulation of Window Resize after the animations are completed
        setTimeout(function() {
          clearInterval(simulateWindowResize);
        }, 1000);

      });
    });
  });
</script>
